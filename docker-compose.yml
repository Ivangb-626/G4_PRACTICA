services:
  mongodb:
    image: mongo:6.0
    container_name: mdh_mongo
    command: ["--quiet"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - mdh_net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mdh_backend
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=production
      - FLASK_APP=app.main
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=8000
      - MONGO_URI=mongodb://mongodb:27017/masterdehostias
      - JWT_SECRET=${JWT_SECRET:-change_me_in_env}
      - AI_SERVICE_URL=http://ai-service:8001
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - mdh_net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: mdh_ai
    ports:
      - "8001:8001"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    networks:
      - mdh_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mdh_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
      - ai-service
    networks:
      - mdh_net

networks:
  mdh_net:
    driver: bridge

volumes:
  mongo_data:
